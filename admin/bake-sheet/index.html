<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="icon" href="/admin/icons/icon-192.png">
  <title>Bake Sheet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a; --near: #141414; --card: #1a1a1a; --border: #2a2a2a;
      --muted: #8a8a8a; --white: #fff; --yellow: #f5e600; --red: #ff6b6b; --green: #6dff9a; --blue: #8ab4ff;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--black); color: var(--white); font-family: Arial, sans-serif; font-size: 16px; line-height: 1.45; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; }

    header { position: sticky; top: 0; z-index: 5; background: var(--black); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .logo { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
    .logo span { color: var(--yellow); }
    header nav { margin-left: auto; display: flex; gap: 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    header nav a { text-decoration: none; color: var(--muted); }
    header nav a.active { color: var(--yellow); }

    main { max-width: 760px; margin: 0 auto; padding: 14px 16px 90px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .chip { flex: 0 0 auto; border: 1.5px solid var(--border); background: var(--near); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .chip.on { border-color: var(--yellow); color: var(--yellow); }
    .chip input { background: none; border: 0; width: 8.5em; }

    .summary { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin: 12px 0 18px; }
    .bake { font-family: 'Arial Black', Arial, sans-serif; font-size: 28px; line-height: 1.1; }
    .bake small { display: block; font-family: Arial, sans-serif; font-size: 15px; color: var(--muted); margin-top: 4px; font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat { background: var(--near); border-radius: 4px; padding: 8px; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .stat.warn b { color: var(--red); }
    .linkbtn { background: none; border: 0; color: var(--yellow); text-decoration: underline; cursor: pointer; font-size: 14px; padding: 0; }

    h2 { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--yellow); margin: 22px 0 8px; display: flex; justify-content: space-between; }
    h2 span { color: var(--muted); letter-spacing: 0; }

    .stop { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .stop.done { opacity: .55; }
    .stop-head { display: flex; align-items: center; gap: 10px; padding: 12px; }
    .stop-title { flex: 1; min-width: 0; }
    .stop-title b { display: block; font-size: 17px; }
    .stop-title small { color: var(--muted); }
    .check { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 10px; border: 2px solid var(--border); background: var(--near); font-size: 26px; display: grid; place-items: center; cursor: pointer; }
    .check.on { background: var(--green); border-color: var(--green); color: var(--black); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--near); font-weight: 700; text-decoration: none; cursor: pointer; font-size: 15px; }
    .btn.primary { background: var(--yellow); color: var(--black); border-color: var(--yellow); }
    .btn.danger { border-color: var(--red); color: var(--red); }

    .entry { border-top: 1px solid var(--border); padding: 10px 12px; }
    .entry.skipped { opacity: .45; }
    .entry-top { display: flex; align-items: baseline; gap: 8px; }
    .entry-name { font-weight: 700; flex: 1; min-width: 0; }
    .loaves { font-family: 'Arial Black', Arial, sans-serif; font-size: 18px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag { font-size: 12px; font-weight: 700; border-radius: 3px; padding: 1px 6px; background: var(--near); color: var(--muted); border: 1px solid var(--border); }
    .tag.red { color: var(--red); border-color: var(--red); }
    .tag.blue { color: var(--blue); border-color: var(--blue); }
    .tag.yellow { color: var(--yellow); border-color: var(--yellow); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .note { margin-top: 6px; color: var(--muted); font-style: italic; }
    .addr { margin-top: 8px; background: var(--near); border-radius: 4px; padding: 8px 10px; white-space: pre-line; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }

    .empty { color: var(--muted); padding: 30px 0; text-align: center; }
    .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6; }

    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
    .sheet-bg.open { display: flex; }
    .sheet { background: var(--card); width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .sheet h3 { font-size: 18px; margin-bottom: 10px; }
    .sheet .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .sheet label { font-size: 13px; color: var(--muted); }
    .sheet input, .sheet select, .sheet textarea { background: var(--near); border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%; }
    .sheet .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .sheet .msg { color: var(--red); min-height: 1.4em; margin-top: 6px; }

    .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--white); color: var(--black); padding: 10px 16px; border-radius: 8px; font-weight: 700; z-index: 30; display: none; max-width: calc(100% - 32px); text-align: center; }

    .gate { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
    .gate input { width: 100%; background: var(--near); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; margin: 12px 0; }

    @media print {
      header, .chips, .fab, .actions, .check, .linkbtn, .toast { display: none !important; }
      body { background: #fff; color: #000; }
      .summary, .stop, .stat { background: #fff; border-color: #999; }
      .stop.done { opacity: 1; }
      h2 { color: #000; }
      .tag { color: #000; border-color: #999; }
      main { padding: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <div class="logo">Just<span>Bread</span> Admin</div>
    <form id="login">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary" style="width:100%">Log in</button>
      <p id="gate-msg" style="color:var(--red);margin-top:8px"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header>
      <div class="logo">J<span>B</span></div>
      <nav>
        <a href="/admin/bake-sheet/" class="active">Sheet</a>
        <a href="/admin/schedule/">Schedule</a>
        <a href="/admin/standing/">Standing</a>
        <a href="/admin/">Pay</a>
      </nav>
    </header>
    <main>
      <div class="chips" id="chips"></div>
      <div id="sheet"></div>
    </main>
    <button class="btn primary fab" id="add-btn">+ Order</button>
  </div>

  <div class="sheet-bg" id="modal-bg"><div class="sheet" id="modal"></div></div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let current = null; // the loaded sheet
  let thursday = null;

  // ── API ────────────────────────────────────────────────────────────────
  async function api(path, body) {
    const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
    if (res.status === 401) { showGate(); throw new Error('Please log in again.'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    return data;
  }

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 2600);
  }

  // ── dates ──────────────────────────────────────────────────────────────
  const fmtDay = (d) => new Date(`${d}T12:00:00Z`).toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
  const addDays = (d, n) => { const t = new Date(`${d}T12:00:00Z`); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const nextThursday = (today) => { let d = today; while (new Date(`${d}T12:00:00Z`).getUTCDay() !== 4) d = addDays(d, 1); return d; };
  const isThu = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && new Date(`${d}T12:00:00Z`).getUTCDay() === 4;
  const chargeDay = (iso) => new Date(iso).toLocaleDateString('en-US', { timeZone: 'America/Chicago', weekday: 'short' });

  // ── gate ───────────────────────────────────────────────────────────────
  function showGate() { $('#app').hidden = true; $('#gate').hidden = false; $('#pw').focus(); }
  $('#login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#gate-msg').textContent = '';
    try { await api('/api/login', { password: $('#pw').value }); $('#pw').value = ''; start(); }
    catch (err) { $('#gate-msg').textContent = err.message; }
  });

  // ── chips ──────────────────────────────────────────────────────────────
  async function loadChips() {
    const { today, thursdays } = await api('/api/bake-sheet');
    const next = nextThursday(today);
    const days = [...new Set([next, addDays(next, 7), ...thursdays])].sort();
    const saved = store.get('jb.thursday');
    thursday = thursday || (saved && saved >= addDays(today, -7) ? saved : (thursdays.find((d) => d >= today) || next));
    const chips = $('#chips');
    chips.replaceChildren(
      ...days.filter((d) => d >= addDays(today, -7)).map((d) => el('button', { class: `chip${d === thursday ? ' on' : ''}`, onclick: () => pick(d) }, d === next ? `This Thu · ${fmtDay(d)}` : fmtDay(d))),
      el('label', { class: 'chip' }, el('input', { type: 'date', value: thursday, onchange: (e) => isThu(e.target.value) ? pick(e.target.value) : toast('Pick a Thursday') })),
    );
  }

  async function pick(d) { thursday = d; store.set('jb.thursday', d); await loadChips(); await loadSheet(); }

  // ── sheet ──────────────────────────────────────────────────────────────
  async function loadSheet() {
    const box = $('#sheet');
    try { current = await api(`/api/bake-sheet?date=${thursday}`); }
    catch (err) { box.replaceChildren(el('p', { class: 'empty' }, err.message)); return; }
    render();
  }

  function render() {
    const s = current.summary;
    const box = $('#sheet');
    const nodes = [];
    nodes.push(el('div', { class: 'summary' },
      el('div', { class: 'bake' }, `${s.to_bake} to bake`,
        el('small', {}, `${s.ordered} ordered + ${s.extras} extra${s.extras_overridden ? ' (set by you)' : ''}`,
          s.expected_loaves ? ` · includes ${s.expected_loaves} expected` : '', ' · ',
          el('button', { class: 'linkbtn', onclick: editExtras }, 'change extras'))),
      el('div', { class: 'grid' },
        stat(s.local_loaves, 'Local'), stat(s.pickup_loaves, 'Pickup'), stat(s.shipped_loaves, 'Shipped'),
        stat(`${s.stops_done}/${s.stops}`, 'Stops done'), stat(s.declined, 'Declined', s.declined > 0), stat(s.manual_or_standing, 'Manual / barter')),
      el('div', { class: 'actions' }, el('button', { class: 'btn', onclick: () => window.print() }, 'Print'))));

    if (!current.entries.length) nodes.push(el('p', { class: 'empty' }, 'Nothing on this Thursday yet.'));

    const groups = [
      ['local_delivery', 'Local delivery'],
      ['pickup', 'Pickup'],
      ['shipping', 'Shipped'],
    ];
    for (const [kind, title] of groups) {
      const stops = current.stops.filter((x) => x.kind === kind);
      const skippedOnly = current.entries.filter((e) => e.skipped && (kind === 'shipping' ? e.delivery_method === 'shipped' : e.delivery_method === kind) && !current.stops.some((x) => x.stop_key === e.stop_key));
      if (!stops.length && !skippedOnly.length) continue;
      const loaves = stops.reduce((a, x) => a + x.loaves, 0);
      nodes.push(el('h2', {}, title, el('span', {}, `${loaves} loaves · ${stops.length} stop${stops.length === 1 ? '' : 's'}`)));
      for (const stop of stops) nodes.push(renderStop(stop));
      if (skippedOnly.length) nodes.push(el('div', { class: 'stop' }, ...skippedOnly.map((e) => renderEntry(e, false))));
    }
    box.replaceChildren(...nodes);
  }

  const stat = (v, label, warn) => el('div', { class: `stat${warn ? ' warn' : ''}` }, el('b', {}, v), el('span', {}, label));

  function mapsUrl(a) {
    const q = [a.line1, a.line2, a.city, a.state, a.postal_code].filter(Boolean).join(', ');
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  }

  function renderStop(stop) {
    const entries = current.entries.filter((e) => e.stop_key === stop.stop_key);
    const names = [...new Set(entries.filter((e) => !e.skipped).map((e) => e.customer_name))].join(', ');
    const done = !!stop.delivered_at;
    const title = stop.kind === 'local_delivery' ? names : stop.label;
    const sub = stop.kind === 'local_delivery'
      ? `${stop.loaves} ${stop.loaves === 1 ? 'loaf' : 'loaves'}`
      : `${stop.loaves} loaves · ${stop.order_count} order${stop.order_count === 1 ? '' : 's'}`;
    return el('div', { class: `stop${done ? ' done' : ''}` },
      el('div', { class: 'stop-head' },
        el('div', { class: 'stop-title' }, el('b', {}, title), el('small', {}, sub)),
        stop.kind === 'local_delivery' && stop.address ? el('a', { class: 'btn', href: mapsUrl(stop.address), target: '_blank', rel: 'noopener' }, '📍 Map') : null,
        el('button', { class: `check${done ? ' on' : ''}`, 'aria-label': done ? 'Delivered' : 'Mark delivered', onclick: () => toggleDelivered(stop) }, done ? '✓' : '')),
      ...entries.map((e) => renderEntry(e, stop.kind === 'local_delivery' && entries.length === 1)));
  }

  // single: the stop header already shows this customer's name and loaves.
  function renderEntry(e, single) {
    const tags = [el('span', { class: 'tag' }, e.source_tag)];
    if (e.kind === 'expected') tags.push(el('span', { class: 'tag blue' }, `Expected (charges ${chargeDay(e.expected_charge_at)})`));
    if (e.declined) tags.push(el('span', { class: 'tag red' }, 'Declined'));
    if (e.refunded_cents) tags.push(el('span', { class: 'tag yellow' }, `Partly refunded $${(e.refunded_cents / 100).toFixed(2)}`));
    if (e.payment_status === 'unpaid') tags.push(el('span', { class: 'tag yellow' }, 'Unpaid'));
    if (e.skipped) tags.push(el('span', { class: 'tag' }, 'Skipped'));

    const acts = [];
    if (e.customer_email) acts.push(el('a', { class: 'btn', href: `mailto:${e.customer_email}` }, '✉️ Email'));
    if (e.customer_phone) {
      acts.push(el('a', { class: 'btn', href: `tel:${e.customer_phone}` }, '📞 Call'));
      acts.push(el('a', { class: 'btn', href: `sms:${e.customer_phone}` }, '💬 Text'));
    }
    if (e.declined && e.id) acts.push(el('button', { class: 'btn', onclick: () => run(() => api('/api/order-edit', { action: 'resolve_declined', id: e.id }), 'Marked resolved') }, 'Resolved'));
    acts.push(el('button', { class: 'btn', onclick: () => openActions(e) }, '⋯'));

    return el('div', { class: `entry${e.skipped ? ' skipped' : ''}` },
      single ? null : el('div', { class: 'entry-top' }, el('span', { class: 'entry-name' }, e.customer_name), el('span', { class: 'loaves' }, e.loaves)),
      el('div', { class: 'tags' }, tags),
      e.delivery_method === 'shipped' && e.address ? shippedAddress(e) : null,
      e.note ? el('div', { class: 'note' }, e.note) : null,
      el('div', { class: 'actions' }, acts));
  }

  function shippedAddress(e) {
    const a = e.address;
    const text = [a.name || e.customer_name, a.line1, a.line2, `${a.city || ''}, ${a.state || ''} ${a.postal_code || ''}`.trim()].filter(Boolean).join('\n');
    return el('div', {},
      el('div', { class: 'addr' }, text),
      el('div', { class: 'actions' }, el('button', { class: 'btn', onclick: async () => {
        try { await navigator.clipboard.writeText(text); toast('Address copied'); } catch { toast('Copy failed: long-press the address'); }
      } }, '📋 Copy address')));
  }

  async function run(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); closeModal(); await loadSheet(); }
    catch (err) { const m = $('#modal .msg'); if (m && $('#modal-bg').classList.contains('open')) m.textContent = err.message; else toast(err.message); }
  }

  async function toggleDelivered(stop) {
    const delivered = !stop.delivered_at;
    stop.delivered_at = delivered ? new Date().toISOString() : null; // instant feedback
    current.summary.stops_done += delivered ? 1 : -1;
    render();
    try { await api('/api/stops', { thursday, stop_key: stop.stop_key, delivered }); }
    catch (err) { toast(err.message); await loadSheet(); }
  }

  // ── modals ─────────────────────────────────────────────────────────────
  function openModal(...kids) { $('#modal').replaceChildren(...kids, el('div', { class: 'msg' })); $('#modal-bg').classList.add('open'); }
  function closeModal() { $('#modal-bg').classList.remove('open'); }
  $('#modal-bg').addEventListener('click', (e) => { if (e.target.id === 'modal-bg') closeModal(); });
  const row = (label, input) => el('div', { class: 'row' }, el('label', {}, label), input);
  const cancelBtn = () => el('button', { class: 'btn', onclick: closeModal }, 'Close');

  function editExtras() {
    const input = el('input', { type: 'number', min: 0, inputmode: 'numeric', value: current.summary.extras });
    openModal(el('h3', {}, `Extras for ${fmtDay(thursday)}`),
      el('p', { style: 'color:var(--muted);margin-bottom:10px' }, `Default is 1 per 12 ordered (${Math.floor(current.summary.ordered / 12)}).`),
      row('Extra loaves', input),
      el('div', { class: 'btns' },
        el('button', { class: 'btn primary', onclick: () => run(() => api('/api/stops', { thursday, extras: parseInt(input.value, 10) }), 'Extras saved') }, 'Save'),
        el('button', { class: 'btn', onclick: () => run(() => api('/api/stops', { thursday, extras: null }), 'Back to default') }, 'Use default'),
        cancelBtn()));
  }

  function openActions(e) {
    const btns = [];
    if (e.kind === 'order') {
      btns.push(el('button', { class: 'btn', onclick: () => editField(e, 'fulfillment_date', 'Move to Thursday', 'date', thursday) }, 'Move to another Thursday'));
      btns.push(el('button', { class: 'btn', onclick: () => editField(e, 'loaves', 'Loaves for this delivery', 'number', e.loaves) }, 'Change loaves'));
      btns.push(el('button', { class: 'btn', onclick: () => editField(e, 'note', 'Note', 'text', e.note || '') }, 'Edit note'));
      btns.push(el('button', { class: 'btn', onclick: () => editField(e, 'customer_phone', 'Phone', 'tel', e.customer_phone || '') }, 'Edit phone'));
      if (e.delivery_method !== 'pickup') btns.push(el('button', { class: 'btn', onclick: () => editAddress(e) }, 'Edit address'));
    }
    if (e.stripe_subscription_id) {
      if (e.kind === 'expected' && !e.skipped) btns.push(el('button', { class: 'btn', onclick: () => run(() => api('/api/subscription-control', { subscriptionId: e.stripe_subscription_id, action: 'skip_week', thursday }), 'Skipped. No charge this week.') }, 'Skip this week (no charge)'));
      btns.push(el('button', { class: 'btn', onclick: () => skipUntil(e) }, 'Skip until…'));
      if (e.skipped) btns.push(el('button', { class: 'btn', onclick: () => run(() => api('/api/subscription-control', { subscriptionId: e.stripe_subscription_id, action: 'resume' }), 'Resumed') }, 'Resume now'));
    }
    if (e.kind === 'standing') {
      btns.push(e.skipped
        ? el('button', { class: 'btn', onclick: () => run(() => api('/api/standing-orders', { action: 'unskip', id: e.standing_order_id, thursday }), 'Back on') }, 'Undo skip')
        : el('button', { class: 'btn', onclick: () => run(() => api('/api/standing-orders', { action: 'skip', id: e.standing_order_id, thursday }), 'Skipped this Thursday') }, 'Skip this Thursday'));
      btns.push(el('button', { class: 'btn', onclick: () => {
        const input = el('input', { type: 'number', min: 1, inputmode: 'numeric', value: e.loaves });
        openModal(el('h3', {}, `${e.customer_name}: loaves this Thursday only`), row('Loaves', input),
          el('div', { class: 'btns' }, el('button', { class: 'btn primary', onclick: () => run(() => api('/api/standing-orders', { action: 'override', id: e.standing_order_id, thursday, fields: { loaves: parseInt(input.value, 10) } }), 'Saved') }, 'Save'), cancelBtn()));
      } }, 'Change loaves this Thursday'));
    }
    if (e.kind === 'order') btns.push(el('button', { class: 'btn danger', onclick: () => confirmCancel(e) }, 'Cancel this delivery'));
    btns.push(cancelBtn());
    openModal(el('h3', {}, e.customer_name), el('div', { class: 'btns' }, btns));
  }

  function editField(e, field, label, type, value) {
    const input = el('input', { type, value, ...(type === 'number' ? { min: 1, inputmode: 'numeric' } : {}) });
    openModal(el('h3', {}, `${e.customer_name}: ${label}`), row(label, input),
      el('div', { class: 'btns' },
        el('button', { class: 'btn primary', onclick: () => {
          let v = input.value;
          if (type === 'number') v = parseInt(v, 10);
          if (type === 'date' && !isThu(v)) { $('#modal .msg').textContent = 'Pick a Thursday.'; return; }
          run(() => api('/api/order-edit', { action: 'edit', id: e.id, fields: { [field]: v } }), 'Saved');
        } }, 'Save'), cancelBtn()));
  }

  function editAddress(e) {
    const a = e.address || {};
    const f = Object.fromEntries(['line1', 'line2', 'city', 'state', 'postal_code'].map((k) => [k, el('input', { value: a[k] || '' })]));
    openModal(el('h3', {}, `${e.customer_name}: address`),
      row('Street', f.line1), row('Apt / unit', f.line2), row('City', f.city), row('State', f.state), row('ZIP', f.postal_code),
      el('div', { class: 'btns' },
        el('button', { class: 'btn primary', onclick: () => run(() => api('/api/order-edit', { action: 'edit', id: e.id, fields: { shipping_address: { ...a, ...Object.fromEntries(Object.entries(f).map(([k, i]) => [k, i.value.trim() || null])) } } }), 'Address saved') }, 'Save'),
        cancelBtn()));
  }

  function skipUntil(e) {
    const input = el('input', { type: 'date', value: addDays(thursday, 14) });
    openModal(el('h3', {}, `${e.customer_name}: skip until`),
      el('p', { style: 'color:var(--muted);margin-bottom:10px' }, 'No charges or deliveries until this Thursday. They get bread again on it.'),
      row('Back on (a Thursday)', input),
      el('div', { class: 'btns' },
        el('button', { class: 'btn primary', onclick: () => {
          if (!isThu(input.value)) { $('#modal .msg').textContent = 'Pick a Thursday.'; return; }
          run(() => api('/api/subscription-control', { subscriptionId: e.stripe_subscription_id, action: 'skip_until', thursday: input.value }), `Skipped until ${fmtDay(input.value)}`);
        } }, 'Skip'), cancelBtn()));
  }

  function confirmCancel(e) {
    openModal(el('h3', {}, `Cancel ${e.customer_name}'s delivery on ${fmtDay(thursday)}?`),
      el('p', { style: 'color:var(--muted);margin-bottom:10px' }, e.payment_status === 'paid' && e.source_tag !== 'Manual'
        ? 'This takes it off the sheet. It does not refund. Refund in Stripe if needed; the sheet updates itself.'
        : 'This takes it off the sheet.'),
      el('div', { class: 'btns' },
        el('button', { class: 'btn danger', onclick: () => run(() => api('/api/order-edit', { action: 'cancel', id: e.id }), 'Delivery cancelled') }, 'Cancel delivery'),
        el('button', { class: 'btn', onclick: closeModal }, 'Keep it')));
  }

  // ── add manual order ─────────────────────────────────────────────────
  $('#add-btn').addEventListener('click', () => {
    const f = {
      name: el('input', { autocomplete: 'off' }), loaves: el('input', { type: 'number', min: 1, value: 1, inputmode: 'numeric' }),
      method: el('select', {}, el('option', { value: 'local_delivery' }, 'Local delivery'), el('option', { value: 'pickup' }, 'Pickup point'), el('option', { value: 'shipped' }, 'Shipped')),
      pickup: el('input', { placeholder: 'e.g. Energy City Brewing — Batavia' }),
      line1: el('input', {}), line2: el('input', {}), city: el('input', {}), state: el('input', { value: 'IL' }), zip: el('input', { inputmode: 'numeric' }),
      email: el('input', { type: 'email' }), phone: el('input', { type: 'tel' }),
      thursday: el('input', { type: 'date', value: thursday }),
      paid: el('select', {}, el('option', { value: 'unpaid' }, 'Unpaid'), el('option', { value: 'paid' }, 'Paid')),
      note: el('input', {}),
    };
    const addrBox = el('div', {}, row('Street', f.line1), row('Apt / unit', f.line2), row('City', f.city), row('State', f.state), row('ZIP', f.zip));
    const pickupBox = el('div', { hidden: true }, row('Pickup point', f.pickup));
    f.method.addEventListener('change', () => { addrBox.hidden = f.method.value === 'pickup'; pickupBox.hidden = f.method.value !== 'pickup'; });
    openModal(el('h3', {}, 'Add an order'),
      row('Name', f.name), row('Loaves', f.loaves), row('How it gets there', f.method), addrBox, pickupBox,
      row('Thursday', f.thursday), row('Paid?', f.paid), row('Email (optional)', f.email), row('Phone (optional)', f.phone), row('Note', f.note),
      el('div', { class: 'btns' },
        el('button', { class: 'btn primary', onclick: () => {
          const method = f.method.value;
          run(() => api('/api/order-edit', { action: 'create_manual', fields: {
            name: f.name.value.trim(), loaves: parseInt(f.loaves.value, 10), delivery_method: method,
            pickup_location: method === 'pickup' ? f.pickup.value.trim() : null,
            address: method === 'pickup' ? null : { name: f.name.value.trim(), line1: f.line1.value.trim(), line2: f.line2.value.trim() || null, city: f.city.value.trim(), state: f.state.value.trim(), postal_code: f.zip.value.trim(), country: 'US' },
            thursday: f.thursday.value, paid: f.paid.value === 'paid',
            email: f.email.value.trim() || null, phone: f.phone.value.trim() || null, note: f.note.value.trim() || null,
          } }), 'Order added');
        } }, 'Add order'), cancelBtn()));
  });

  // ── start ──────────────────────────────────────────────────────────────
  async function start() {
    $('#gate').hidden = true; $('#app').hidden = false;
    try { await loadChips(); await loadSheet(); } catch (err) { toast(err.message); }
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).catch(() => {});
  fetch('/api/login').then((r) => r.json()).then((d) => (d.loggedIn ? start() : showGate())).catch(showGate);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && thursday) loadSheet(); });
})();
</script>
</body>
</html>
