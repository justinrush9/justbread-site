<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Orders — JustBread Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a; --near: #111; --border: #222; --mid: #2a2a2a;
      --muted: #666; --sub: #999; --white: #fff; --yellow: #f5e600;
      --red: #ff6b6b; --green: #6dff9a;
    }
    body { background: var(--black); color: var(--white); font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    nav { background: var(--black); border-bottom: 1px solid var(--border); padding: 0 40px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-size: 18px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--white); text-decoration: none; font-family: 'Arial Black', Arial, sans-serif; }
    .nav-logo span { color: var(--yellow); }
    @media (max-width: 600px) { nav { padding: 0 20px; } }

    .page { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
    .page-eyebrow { font-family: Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: var(--yellow); margin-bottom: 0.5rem; }
    .page-title { font-family: 'Arial Black', Arial, sans-serif; font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 900; line-height: 1.1; margin-bottom: 1rem; color: var(--white); text-transform: uppercase; }

    /* ── password gate ── */
    .gate { max-width: 360px; margin: 4rem auto; }
    .gate .card { background: var(--near); border: 1px solid var(--border); border-radius: 3px; padding: 1.5rem; }
    label { display: block; font-size: 0.875rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="password"] { width: 100%; border: 1.5px solid var(--mid); border-radius: 3px; padding: 0.65rem 0.9rem; font-size: 1rem; background: var(--black); color: var(--white); outline: none; transition: border-color 0.15s; font-family: Arial, sans-serif; margin-bottom: 1rem; }
    input[type="password"]:focus { border-color: var(--yellow); }
    .btn { background: var(--yellow); color: #000; border: none; border-radius: 3px; padding: 0.7rem 1.4rem; font-size: 0.95rem; font-weight: 900; font-family: 'Arial Black', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; width: 100%; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #gate-msg { margin-top: 0.75rem; font-size: 0.875rem; color: var(--red); min-height: 1.4rem; }

    /* ── dashboard ── */
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .toolbar-btn { background: none; border: 1.5px solid var(--mid); color: var(--sub); border-radius: 3px; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; font-family: Arial, sans-serif; }
    .toolbar-btn:hover { border-color: var(--yellow); color: var(--yellow); }
    .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .stat { background: var(--near); border: 1px solid var(--border); border-radius: 3px; padding: 1rem 1.25rem; min-width: 120px; }
    .stat-num { font-family: 'Arial Black', Arial, sans-serif; font-size: 1.6rem; color: var(--yellow); }
    .stat-label { font-size: 0.75rem; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-top: 0.25rem; }

    .table-wrap { background: var(--near); border: 1px solid var(--border); border-radius: 3px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
    th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--sub); font-weight: 700; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .pill-local { background: rgba(109,255,154,0.12); color: var(--green); }
    .pill-shipped { background: rgba(255,255,255,0.08); color: var(--sub); }
    .delivery-override { margin-top: 4px; font-size: 11px; color: var(--yellow, #f5e600); max-width: 220px; }
    .empty, .loading, .error { text-align: center; padding: 3rem 1rem; color: var(--sub); }
    .error { color: var(--red); }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">Just<span>Bread</span></a>
</nav>

<div class="page">
  <div id="gate" class="gate">
    <div class="page-eyebrow">Admin</div>
    <h1 class="page-title" style="font-size:1.6rem;">Orders</h1>
    <div class="card">
      <label for="pw">Password</label>
      <input type="password" id="pw" autocomplete="current-password">
      <button class="btn" id="pw-submit">View orders</button>
      <div id="gate-msg"></div>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="page-eyebrow">Admin</div>
    <h1 class="page-title">Orders</h1>
    <div class="toolbar">
      <div class="stats" id="stats"></div>
      <button class="toolbar-btn" id="refresh-btn">Refresh</button>
    </div>
    <div class="table-wrap">
      <table id="orders-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Email</th>
            <th class="num">Loaves</th>
            <th>Fulfillment</th>
            <th>Type</th>
            <th>Cadence</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
      <div id="orders-status" class="loading">Loading…</div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'jb_admin_pw';
  const gate = document.getElementById('gate');
  const dashboard = document.getElementById('dashboard');
  const gateMsg = document.getElementById('gate-msg');
  const pwInput = document.getElementById('pw');
  const pwSubmit = document.getElementById('pw-submit');
  const ordersBody = document.getElementById('orders-body');
  const ordersStatus = document.getElementById('orders-status');
  const statsEl = document.getElementById('stats');
  const refreshBtn = document.getElementById('refresh-btn');

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function renderStats(orders) {
    const totalLoaves = orders.reduce((sum, o) => sum + (o.loaves || 0), 0);
    const local = orders.filter((o) => o.fulfillment_type === 'local').length;
    const shipped = orders.filter((o) => o.fulfillment_type === 'shipped').length;
    statsEl.innerHTML = `
      <div class="stat"><div class="stat-num">${orders.length}</div><div class="stat-label">Orders</div></div>
      <div class="stat"><div class="stat-num">${totalLoaves}</div><div class="stat-label">Loaves</div></div>
      <div class="stat"><div class="stat-num">${local}</div><div class="stat-label">Local</div></div>
      <div class="stat"><div class="stat-num">${shipped}</div><div class="stat-label">Shipped</div></div>
    `;
  }

  function renderOrders(orders) {
    if (orders.length === 0) {
      ordersStatus.textContent = 'No orders yet.';
      ordersStatus.className = 'empty';
      ordersStatus.style.display = 'block';
      ordersBody.innerHTML = '';
      return;
    }
    ordersStatus.style.display = 'none';
    ordersBody.innerHTML = orders.map((o) => `
      <tr>
        <td>${fmtDate(o.created_at)}</td>
        <td>${o.customer_name || '—'}</td>
        <td>${o.customer_email || '—'}</td>
        <td class="num">${o.loaves}</td>
        <td><span class="pill ${o.fulfillment_type === 'local' ? 'pill-local' : 'pill-shipped'}">${o.fulfillment_type}</span>${o.delivery_override ? `<div class="delivery-override">⚠ ${o.delivery_override}</div>` : ''}</td>
        <td>${o.order_type}</td>
        <td>${o.cadence || '—'}</td>
        <td>${o.status}</td>
      </tr>
    `).join('');
  }

  async function loadOrders(password) {
    ordersStatus.textContent = 'Loading…';
    ordersStatus.className = 'loading';
    ordersStatus.style.display = 'block';
    ordersBody.innerHTML = '';
    statsEl.innerHTML = '';

    const res = await fetch('/api/orders', { headers: { 'x-admin-password': password } });

    if (res.status === 401) {
      sessionStorage.removeItem(STORAGE_KEY);
      dashboard.style.display = 'none';
      gate.style.display = 'block';
      gateMsg.textContent = 'Wrong password.';
      return;
    }
    if (!res.ok) {
      ordersStatus.textContent = 'Failed to load orders. Try refreshing.';
      ordersStatus.className = 'error';
      return;
    }

    const { orders } = await res.json();
    gate.style.display = 'none';
    dashboard.style.display = 'block';
    renderStats(orders);
    renderOrders(orders);
  }

  function attemptLogin() {
    const password = pwInput.value;
    if (!password) return;
    sessionStorage.setItem(STORAGE_KEY, password);
    loadOrders(password);
  }

  pwSubmit.addEventListener('click', attemptLogin);
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  refreshBtn.addEventListener('click', () => {
    const password = sessionStorage.getItem(STORAGE_KEY);
    if (password) loadOrders(password);
  });

  const stored = sessionStorage.getItem(STORAGE_KEY);
  if (stored) loadOrders(stored);
</script>
</body>
</html>
