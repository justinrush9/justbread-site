<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="icon" href="/admin/icons/icon-192.png">
  <title>Standing Orders</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black: #0a0a0a; --near: #141414; --card: #1a1a1a; --border: #2a2a2a; --muted: #8a8a8a; --white: #fff; --yellow: #f5e600; --red: #ff6b6b; }
    body { background: var(--black); color: var(--white); font-family: Arial, sans-serif; font-size: 16px; line-height: 1.45; min-height: 100vh; }
    button, input, select { font: inherit; color: inherit; }
    header { position: sticky; top: 0; z-index: 5; background: var(--black); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .logo { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; letter-spacing: 2px; }
    .logo span { color: var(--yellow); }
    header nav { margin-left: auto; display: flex; gap: 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    header nav a { text-decoration: none; color: var(--muted); }
    header nav a.active { color: var(--yellow); }
    main { max-width: 760px; margin: 0 auto; padding: 14px 16px 90px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .card.paused, .card.ended { opacity: .55; }
    .card b { font-size: 17px; }
    .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--near); font-weight: 700; cursor: pointer; }
    .btn.primary { background: var(--yellow); color: var(--black); border-color: var(--yellow); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); }
    .empty { color: var(--muted); padding: 30px 0; text-align: center; }
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
    .sheet-bg.open { display: flex; }
    .sheet { background: var(--card); width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .sheet h3 { margin-bottom: 10px; }
    .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .row label { font-size: 13px; color: var(--muted); }
    .row input, .row select { background: var(--near); border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%; }
    .btns { display: flex; flex-direction: column; gap: 8px; }
    .msg { color: var(--red); min-height: 1.4em; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">J<span>B</span></div>
    <nav><a href="/admin/bake-sheet/">Sheet</a><a href="/admin/route/">Route</a>
        <a href="/admin/schedule/">Schedule</a>
        <a href="/admin/standing/" class="active">Standing</a><a href="/admin/">Pay</a></nav>
  </header>
  <main><div id="list"></div></main>
  <button class="btn primary fab" id="add">+ Standing order</button>
  <div class="sheet-bg" id="bg"><div class="sheet" id="modal"></div></div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const isThu = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && new Date(`${d}T12:00:00Z`).getUTCDay() === 4;
  const fmt = (d) => d ? new Date(`${String(d).slice(0, 10)}T12:00:00Z`).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago' }).format(new Date());
  const nextThu = () => { const t = new Date(`${today}T12:00:00Z`); while (t.getUTCDay() !== 4) t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); };
  const lastThuBefore = (d) => { const t = new Date(`${d}T12:00:00Z`); t.setUTCDate(t.getUTCDate() - 1); while (t.getUTCDay() !== 4) t.setUTCDate(t.getUTCDate() - 1); return t.toISOString().slice(0, 10); };

  async function api(body) {
    const res = await fetch('/api/standing-orders', body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
    if (res.status === 401) { location.href = '/admin/bake-sheet/'; throw new Error('Log in'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    return data;
  }
  const close = () => $('#bg').classList.remove('open');
  $('#bg').addEventListener('click', (e) => { if (e.target.id === 'bg') close(); });
  const open = (...kids) => { $('#modal').replaceChildren(...kids, el('div', { class: 'msg' })); $('#bg').classList.add('open'); };
  const row = (l, i) => el('div', { class: 'row' }, el('label', {}, l), i);
  async function act(body) {
    try { await api(body); close(); load(); } catch (err) { $('#modal .msg') ? ($('#modal .msg').textContent = err.message) : alert(err.message); }
  }

  async function load() {
    const { standingOrders } = await api();
    const list = $('#list');
    if (!standingOrders.length) { list.replaceChildren(el('p', { class: 'empty' }, 'No standing orders yet.')); return; }
    list.replaceChildren(...standingOrders.map((s) => {
      const ended = s.end_date && String(s.end_date).slice(0, 10) < today;
      const where = s.delivery_method === 'pickup' ? s.pickup_location : s.delivery_method === 'shipped' ? 'Shipped' : (s.address?.line1 || 'Local delivery');
      return el('div', { class: `card${s.paused ? ' paused' : ''}${ended ? ' ended' : ''}` },
        el('b', {}, s.name, ' · ', s.loaves, s.loaves === 1 ? ' loaf' : ' loaves'),
        el('div', { class: 'meta' }, s.frequency === 'weekly' ? 'Every week' : 'Every other week', ` from ${fmt(s.start_date)}`,
          s.end_date ? `, last ${fmt(s.end_date)}` : '', s.paused ? ' · PAUSED' : ''),
        el('div', { class: 'meta' }, where),
        s.note ? el('div', { class: 'meta' }, s.note) : null,
        ended ? null : el('div', { class: 'actions' },
          el('button', { class: 'btn', onclick: () => form(s) }, 'Edit'),
          el('button', { class: 'btn', onclick: () => act({ action: s.paused ? 'resume' : 'pause', id: s.id }) }, s.paused ? 'Resume' : 'Pause'),
          el('button', { class: 'btn danger', onclick: () => endIt(s) }, 'End')));
    }));
  }

  function endIt(s) {
    const input = el('input', { type: 'date', value: lastThuBefore(nextThu()) });
    open(el('h3', {}, `End ${s.name}'s standing order`), row('Last Thursday it delivers', input),
      el('div', { class: 'btns' }, el('button', { class: 'btn danger', onclick: () => isThu(input.value) ? act({ action: 'end', id: s.id, thursday: input.value }) : ($('#modal .msg').textContent = 'Pick a Thursday.') }, 'End it'),
        el('button', { class: 'btn', onclick: close }, 'Keep it')));
  }

  function form(s) {
    const a = s?.address || {};
    const f = {
      name: el('input', { value: s?.name || '' }), loaves: el('input', { type: 'number', min: 1, inputmode: 'numeric', value: s?.loaves || 1 }),
      frequency: el('select', {}, el('option', { value: 'weekly' }, 'Every week'), el('option', { value: 'biweekly' }, 'Every other week')),
      start: el('input', { type: 'date', value: s ? String(s.start_date).slice(0, 10) : nextThu() }),
      method: el('select', {}, el('option', { value: 'pickup' }, 'Pickup point'), el('option', { value: 'local_delivery' }, 'Local delivery'), el('option', { value: 'shipped' }, 'Shipped')),
      pickup: el('input', { value: s?.pickup_location || '' }),
      line1: el('input', { value: a.line1 || '' }), city: el('input', { value: a.city || '' }), state: el('input', { value: a.state || 'IL' }), zip: el('input', { value: a.postal_code || '' }),
      email: el('input', { type: 'email', value: s?.email || '' }), phone: el('input', { type: 'tel', value: s?.phone || '' }), note: el('input', { value: s?.note || '' }),
    };
    if (s) { f.frequency.value = s.frequency; f.method.value = s.delivery_method; }
    const addr = el('div', {}, row('Street', f.line1), row('City', f.city), row('State', f.state), row('ZIP', f.zip));
    const pick = el('div', {}, row('Pickup point', f.pickup));
    const sync = () => { addr.hidden = f.method.value === 'pickup'; pick.hidden = f.method.value !== 'pickup'; };
    f.method.addEventListener('change', sync); sync();
    open(el('h3', {}, s ? `Edit ${s.name}` : 'New standing order'),
      el('p', { class: 'meta', style: 'margin-bottom:10px' }, s ? 'Changes apply to every future Thursday. Past Thursdays stay as they were.' : ''),
      row('Name', f.name), row('Loaves', f.loaves), row('How often', f.frequency), row('First Thursday', f.start),
      row('How it gets there', f.method), pick, addr, row('Email (optional)', f.email), row('Phone (optional)', f.phone), row('Note', f.note),
      el('div', { class: 'btns' },
        el('button', { class: 'btn primary', onclick: () => {
          const m = f.method.value;
          const fields = {
            name: f.name.value.trim(), loaves: parseInt(f.loaves.value, 10), frequency: f.frequency.value, start_date: f.start.value,
            delivery_method: m, pickup_location: m === 'pickup' ? f.pickup.value.trim() : null,
            address: m === 'pickup' ? null : { line1: f.line1.value.trim(), city: f.city.value.trim(), state: f.state.value.trim(), postal_code: f.zip.value.trim(), country: 'US' },
            email: f.email.value.trim() || null, phone: f.phone.value.trim() || null, note: f.note.value.trim() || null,
          };
          act(s ? { action: 'update', id: s.id, fields } : { action: 'create', fields });
        } }, 'Save'),
        el('button', { class: 'btn', onclick: close }, 'Close')));
  }

  $('#add').addEventListener('click', () => form(null));
  load().catch((e) => { $('#list').textContent = e.message; });
})();
</script>
</body>
</html>
